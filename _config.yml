theme: jekyll-theme-cayman

title: "Carnell Poteat"
description: "IT Specialist specializing in automation, PowerShell, Ansible, Windows Server, and DevOps."

url: "https://c-nell.github.io"
baseurl: "/portfolio"

author:
  name: "Carnell Poteat"
  email: "nellp7@yahoo.com"
  linkedin: "https://www.linkedin.com/in/carnellpoteat"
  github: "https://github.com/C-Nell"

show_downloads: false

github:
  is_project_page: true
  repository_url: "https://github.com/C-Nell/portfolio"
